<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Package Identifier Tool</title>
<style>
/* ── Reset ──────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Base ───────────────────────────────────────────────── */
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #f0f2f5;
  color: #1a1a2e;
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 2rem 1rem 4rem;
}

.container {
  width: 100%;
  max-width: 660px;
}

h1 {
  font-size: 1.35rem;
  font-weight: 700;
  margin-bottom: 1.5rem;
  color: #1a1a2e;
  letter-spacing: -0.01em;
}

/* ── Tabs ───────────────────────────────────────────────── */
.tabs {
  display: flex;
  border-bottom: 2px solid #d0d5dd;
  margin-bottom: 1.5rem;
}

.tab-btn {
  padding: 0.6rem 1.5rem;
  border: none;
  background: none;
  cursor: pointer;
  font-size: 0.95rem;
  font-weight: 600;
  color: #667085;
  border-bottom: 2.5px solid transparent;
  margin-bottom: -2px;
  transition: color 0.15s, border-color 0.15s;
  letter-spacing: 0.01em;
}

.tab-btn.active {
  color: #2563eb;
  border-bottom-color: #2563eb;
}

.tab-btn:hover:not(.active) { color: #1a1a2e; }

/* ── Panel ──────────────────────────────────────────────── */
.panel { display: none; }
.panel.active { display: block; }

/* ── Card ───────────────────────────────────────────────── */
.card {
  background: #fff;
  border-radius: 12px;
  padding: 1.5rem;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}

/* ── Form elements ──────────────────────────────────────── */
.field { margin-bottom: 1rem; }

label.field-label {
  display: block;
  font-size: 0.85rem;
  font-weight: 600;
  color: #344054;
  margin-bottom: 0.35rem;
}

select, input[type="text"] {
  width: 100%;
  padding: 0.55rem 0.75rem;
  border: 1.5px solid #d0d5dd;
  border-radius: 8px;
  font-size: 0.95rem;
  color: #1a1a2e;
  background: #fff;
  transition: border-color 0.15s, box-shadow 0.15s;
  appearance: none;
  -webkit-appearance: none;
}

select:focus, input[type="text"]:focus {
  outline: none;
  border-color: #2563eb;
  box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
}

/* ── Checkbox options ───────────────────────────────────── */
.options-block {
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
  margin-bottom: 1.1rem;
  padding: 0.85rem 0.9rem;
  border: 1.5px solid #e5e7eb;
  border-radius: 8px;
  background: #f9fafb;
}

.checkbox-row {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  font-size: 0.9rem;
  color: #344054;
  cursor: pointer;
  user-select: none;
}

.checkbox-row input[type="checkbox"] {
  width: 1rem;
  height: 1rem;
  accent-color: #2563eb;
  cursor: pointer;
  flex-shrink: 0;
}

.checkbox-row.hidden { display: none; }
.checkbox-row.disabled { opacity: 0.45; pointer-events: none; }
.checkbox-row .hint { display: block; font-size: 0.78rem; opacity: 0.7; margin-top: 0.15rem; }
.pzn-input-row.hidden { display: none; }

/* ── Button ─────────────────────────────────────────────── */
.btn {
  width: 100%;
  padding: 0.65rem 1rem;
  border: none;
  border-radius: 8px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
  letter-spacing: 0.01em;
}

.btn:active { transform: scale(0.98); }
.btn-primary { background: #2563eb; color: #fff; }
.btn-primary:hover { background: #1d4ed8; }

/* ── Result banner ──────────────────────────────────────── */
.result {
  margin-top: 1.25rem;
  border-radius: 8px;
  padding: 0.95rem 1.1rem;
  font-size: 0.95rem;
  line-height: 1.55;
  display: none;
  border: 1.5px solid transparent;
}

.result.show { display: block; }

.result.success {
  background: #ecfdf5;
  border-color: #6ee7b7;
  color: #065f46;
}

.result.error {
  background: #fff1f2;
  border-color: #fca5a5;
  color: #991b1b;
}

.result-value {
  font-family: ui-monospace, "Courier New", monospace;
  font-size: 1.05rem;
  font-weight: 700;
  word-break: break-all;
  display: block;
  margin-bottom: 0.25rem;
}

.result-label {
  font-size: 0.83rem;
  opacity: 0.85;
}

.copy-btn {
  display: inline-block;
  margin-top: 0.6rem;
  padding: 0.28rem 0.7rem;
  border: 1.5px solid currentColor;
  border-radius: 6px;
  background: transparent;
  font-size: 0.78rem;
  font-weight: 600;
  cursor: pointer;
  color: inherit;
  transition: opacity 0.15s;
}

.copy-btn:hover { opacity: 0.7; }

/* ── Sub-result (embedded PZN) ──────────────────────────── */
.sub-result {
  margin-top: 0.65rem;
  padding: 0.55rem 0.75rem;
  border-radius: 6px;
  font-size: 0.85rem;
  border: 1px solid;
  line-height: 1.45;
}

.sub-result.success { background: #ecfdf5; border-color: #6ee7b7; color: #065f46; }
.sub-result.error   { background: #fff1f2; border-color: #fca5a5; color: #991b1b; }
.sub-result.warn    { background: #fffbeb; border-color: #fcd34d; color: #92400e; }

/* ── Caveat note (EPL v2.3.x compatibility) ───────────────── */
.caveat {
  margin-top: 0.5rem;
  font-size: 0.82rem;
  color: #6b7280;
  font-style: italic;
}
.caveat.hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <h1>&#128230; Package Identifier Tool</h1>

  <div class="tabs">
    <button class="tab-btn active" data-tab="generate">Generate</button>
    <button class="tab-btn" data-tab="validate">Validate</button>
  </div>

  <!-- ======= GENERATE PANEL ======= -->
  <div id="panel-generate" class="panel active">
    <div class="card">
      <div class="field">
        <label class="field-label" for="gen-type">Identifier type</label>
        <select id="gen-type">
          <option value="pzn">PZN &mdash; Pharmazentralnummer (8 digits)</option>
          <option value="ntin">NTIN &mdash; National Trade Item Number (13 digits)</option>
          <option value="gtin">GTIN &mdash; Global Trade Item Number (14 digits)</option>
          <option value="ppn">PPN &mdash; Pharmacy Product Number (9N + 12 digits)</option>
          <option value="pcid">PCID &mdash; Packaged Medicinal Product ID (UUID)</option>
        </select>
      </div>

      <div class="options-block">
        <label class="checkbox-row hidden" id="row-embed-pzn">
          <input type="checkbox" id="gen-embed-pzn" checked>
          Embed a valid PZN inside this identifier
        </label>
        <div class="pzn-input-row hidden" id="row-pzn-input">
          <label class="field-label" for="gen-pzn-input">PZN to embed</label>
          <input type="text" id="gen-pzn-input" placeholder="Optional: exact PZN to embed" autocomplete="off" spellcheck="false">
        </div>
        <label class="checkbox-row" id="row-invalid">
          <input type="checkbox" id="gen-invalid">
          Generate <strong>invalid</strong> identifier (deliberately corrupted check digit)
        </label>
        <label class="checkbox-row hidden" id="row-ppn-prefix">
          <input type="checkbox" id="gen-ppn-prefix" checked>
          Include the <strong>9N</strong> prefix
        </label>
        <label class="checkbox-row hidden" id="row-epl-compat">
          <input type="checkbox" id="gen-epl-compat">
          <span>
            <span title="Generates PPNs using the checksum the EPL backend currently expects, instead of the standard ISO/IEC 7064 formula.">EPL v2.3.x compatibility mode</span>
            <small class="hint">Generates PPNs using the checksum the EPL backend currently expects, instead of the standard ISO/IEC 7064 formula.</small>
          </span>
        </label>
      </div>

      <button class="btn btn-primary" id="btn-generate">Generate</button>

      <div class="result" id="gen-result">
        <span class="result-value" id="gen-value"></span>
        <span class="result-label" id="gen-label"></span><br>
        <button class="copy-btn" id="gen-copy">Copy</button>
        <div id="gen-caveat" class="caveat hidden"></div>
        <div id="gen-embedded"></div>
      </div>
    </div>
  </div>

  <!-- ======= VALIDATE PANEL ======= -->
  <div id="panel-validate" class="panel">
    <div class="card">
      <div class="field">
        <label class="field-label" for="val-type">Identifier type</label>
        <select id="val-type">
          <option value="pzn">PZN &mdash; Pharmazentralnummer</option>
          <option value="ntin">NTIN &mdash; National Trade Item Number</option>
          <option value="gtin">GTIN &mdash; Global Trade Item Number (8 / 12 / 13 / 14 digits)</option>
          <option value="ppn">PPN &mdash; Pharmacy Product Number</option>
          <option value="pcid">PCID &mdash; Packaged Medicinal Product ID (UUID)</option>
        </select>
      </div>

      <div class="field">
        <label class="field-label" for="val-input">Identifier value</label>
        <input type="text" id="val-input" placeholder="Enter identifier&hellip;" autocomplete="off" spellcheck="false">
      </div>

      <button class="btn btn-primary" id="btn-validate">Validate</button>

      <div class="result" id="val-result">
        <span class="result-value" id="val-value"></span>
        <span class="result-label" id="val-label"></span>
        <div id="val-embedded"></div>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

/* ==========================================================
   ALGORITHMS — ported 1:1 from the PHP services
   ========================================================== */

// ── PZN (Pharmazentralnummer) ─────────────────────────────
// MOD-11 with weights [1..7].  Check digit = sum % 11.
// If the result is 10, that slot is not allocated (invalid PZN).
// Dummy PZNs (00000000, 22222222, 33333333, 44444444) are invalid.
// Sources: PZNServiceConstants.php, PznValidationService.php

const PZN_WEIGHTS = [1, 2, 3, 4, 5, 6, 7];
const PZN_DUMMY   = new Set(['00000000', '22222222', '33333333', '44444444']);

function _pznRawCheck(base7) {
  let sum = 0;
  for (let i = 0; i < 7; i++) sum += parseInt(base7[i], 10) * PZN_WEIGHTS[i];
  return sum % 11;
}

function validatePzn(value) {
  if (!/^\d{8}$/.test(value)) return false;
  if (PZN_DUMMY.has(value)) return false;
  const cd = _pznRawCheck(value.slice(0, 7));
  if (cd === 10) return false; // unallocated slot — PZN not issued
  return cd === parseInt(value[7], 10);
}

function generatePzn(wantInvalid) {
  let pzn;
  do {
    const base7 = String(Math.floor(Math.random() * 10_000_000)).padStart(7, '0');
    let cd = _pznRawCheck(base7);
    if (wantInvalid) cd = (cd + 1) % 10; // shift by 1 mod 10 — always wrong
    pzn = base7 + cd;
  } while (!wantInvalid && !validatePzn(pzn));
  return pzn;
}

// ── GTIN (Global Trade Item Number) ──────────────────────
// GS1 MOD-10 algorithm. Last digit is the check digit.
// Weights alternate 3, 1 from right to left (excluding check digit).
// Supported lengths: 8, 12, 13, 14 digits (non-digits are stripped first).
// Source: GtinValidationService.php

function _gtinCheck(base) {
  const len = base.length;
  let sum = 0;
  for (let i = 0; i < len; i++) {
    const digit  = parseInt(base[len - 1 - i], 10);
    const weight = (i % 2 === 0) ? 3 : 1;
    sum += digit * weight;
  }
  return (10 - (sum % 10)) % 10;
}

function validateGtin(value) {
  const digits = value.replace(/\D/g, '');
  if (![8, 12, 13, 14].includes(digits.length)) return false;
  const base   = digits.slice(0, -1);
  const actual = parseInt(digits[digits.length - 1], 10);
  return _gtinCheck(base) === actual;
}

function generateGtin(wantInvalid) {
  let gtin;
  do {
    const base13 = String(Math.floor(Math.random() * 10_000_000_000_000)).padStart(13, '0');
    let cd = _gtinCheck(base13);
    if (wantInvalid) cd = (cd + 1) % 10;
    gtin = base13 + cd;
  } while (!wantInvalid && !validateGtin(gtin));
  return gtin;
}

// ── NTIN (National Trade Item Number) ────────────────────
// 13 digits: GS1 Germany prefix '4150' + 8-digit PZN + 1 MOD-10 check digit.
// Validation is identical to GTIN (NtinValidationService extends GtinValidationService).
// Source: NtinValidationService.php, CreateExampleIdCommand.php

function validateNtin(value) {
  const digits = value.replace(/\D/g, '');
  if (digits.length !== 13) return false;
  return validateGtin(digits);
}

function generateNtin(wantInvalid, embedPzn, customPzn = null) {
  let ntin;
  do {
    const inner  = customPzn !== null
      ? customPzn
      : embedPzn
        ? generatePzn(false)
        : String(Math.floor(Math.random() * 100_000_000)).padStart(8, '0');
    const base12 = '4150' + inner;
    let cd = _gtinCheck(base12);
    if (wantInvalid) cd = (cd + 1) % 10;
    ntin = base12 + cd;
  } while (!wantInvalid && !validateNtin(ntin));
  return ntin;
}

// Structure: [4150 (4)][PZN (8)][check (1)] = 13 digits → PZN at slice(4, 12)
function extractPznFromNtin(value) {
  const digits = value.replace(/\D/g, '');
  if (digits.length !== 13) return null;
  return digits.slice(4, 12);
}

// ── PPN (Pharmacy Product Number) ────────────────────────
// Format: optional '9N' data-identifier prefix + 12 digits
//   12 digits = [IFA PRA code "11" (2)][PZN (8)][check (2)]
// Check digits: ISO/IEC 7064 MOD 97-10, per the IFA PPN specification.
//   body = "11" + 8-digit PZN (10 digits, leading zeroes retained)
//   remainder = decimalModulo(body + "00", 97)
//   check = 98 - remainder, zero-padded to 2 digits
// The '9N' data identifier is never part of the checksum calculation.
// A well-formed PPN (without '9N') always satisfies: decimalModulo(ppn, 97) === 1.

function _decimalModulo(decimalString, divisor) {
  let remainder = 0;
  for (const ch of decimalString) {
    remainder = (remainder * 10 + (ch.charCodeAt(0) - 48)) % divisor;
  }
  return remainder;
}

function _ppnCheck(body10) {
  const remainder = _decimalModulo(body10 + '00', 97);
  return 98 - remainder;
}

// Source: PpnValidationService.php::calculateCheckDigit (legacy formula, pre-fix)
function _ppnCheckEplLegacy(body10) {
  let sum = 0;
  for (let i = 0; i < 10; i++) {
    sum += body10.charCodeAt(i) * (i + 2);
  }
  return sum % 97;
}

function validatePpn(value) {
  let v = value;
  if (v.startsWith('9N')) v = v.slice(2);
  if (!/^\d{12}$/.test(v)) return false;
  const standard = _decimalModulo(v, 97) === 1;
  const legacy   = _ppnCheckEplLegacy(v.slice(0, 10)) === parseInt(v.slice(10), 10);
  return standard || legacy;
}

function generatePpn(wantInvalid, embedPzn, includePrefix = true, eplCompat = false, customPzn = null) {
  let ppn;
  do {
    const inner  = customPzn !== null
      ? customPzn
      : embedPzn
        ? generatePzn(false)
        : String(Math.floor(Math.random() * 100_000_000)).padStart(8, '0');
    const body10 = '11' + inner; // IFA PRA company code '11'
    let cd = eplCompat ? _ppnCheckEplLegacy(body10) : _ppnCheck(body10);
    if (wantInvalid) cd = (cd + 1) % 97;
    ppn = (includePrefix ? '9N' : '') + body10 + String(cd).padStart(2, '0');
  } while (wantInvalid ? validatePpn(ppn) : !validatePpn(ppn));
  return ppn;
}

// After stripping '9N': [IFA code (2)][PZN (8)][check (2)] → PZN at slice(2, 10)
function extractPznFromPpn(value) {
  let v = value;
  if (v.startsWith('9N')) v = v.slice(2);
  if (!/^\d{12}$/.test(v)) return null;
  return v.slice(2, 10);
}

// ── PCID (UUID, any version 1–5) ─────────────────────────
// Invalid generation is not supported — every structurally valid UUID is a valid PCID.

function generatePcid() {
  if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
    return crypto.randomUUID();
  }
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

function validatePcid(value) {
  return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(value);
}

/* ==========================================================
   UI LOGIC
   ========================================================== */

// ── Tab switching ─────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    // T063: write back mode on tab switch
    writeAnchorState();
  });
});

// ── URL Anchor Deep Linking (T058–T060) ────────────────────
const VALID_TYPES = ['pzn', 'ntin', 'gtin', 'ppn', 'pcid'];

function applyAnchorState() {
  const params = new URLSearchParams(location.hash.replace(/^#/, ''));

  // T058: mode — activate the corresponding tab by reusing existing tab-button logic
  const mode = params.get('mode');
  if (mode) {
    const normalizedMode = mode.toLowerCase();
    if (normalizedMode === 'generate' || normalizedMode === 'validate') {
      const targetBtn = document.querySelector('.tab-btn[data-tab="' + normalizedMode + '"]');
      if (targetBtn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        targetBtn.classList.add('active');
        document.getElementById('panel-' + targetBtn.dataset.tab).classList.add('active');
      }
    }
  }

  // T059: package-identifier — set both selects and re-run syncGenOptions()
  const pkgId = params.get('package-identifier');
  if (pkgId) {
    const normalizedPkg = pkgId.toLowerCase();
    if (VALID_TYPES.includes(normalizedPkg)) {
      genTypeEl.value = normalizedPkg;
      document.getElementById('val-type').value = normalizedPkg;
      syncGenOptions();
    }
  }
}

// T060: hashchange listener (initial call moved to end of script to avoid TDZ)
window.addEventListener('hashchange', applyAnchorState);

// T062: Write-back — mirror current UI state back into the URL fragment
function writeAnchorState() {
  // Parse existing fragment to preserve unrelated keys
  var params = new URLSearchParams(location.hash.replace(/^#/, ''));

  // Read active tab from data-tab attribute
  var activeBtn = document.querySelector('.tab-btn.active');
  if (activeBtn) {
    params.set('mode', activeBtn.dataset.tab);
  }

  // Read active type from whichever selector is on the active panel
  var activePanel = document.querySelector('.panel.active');
  if (activePanel) {
    var typeEl = activePanel.querySelector('select');
    if (typeEl) {
      params.set('package-identifier', typeEl.value);
    }
  }

  // Update address bar in place — replaceState does NOT fire hashchange
  // (no read/write feedback loop)
  window.history.replaceState(null, '', location.pathname + location.search + '#' + params.toString());
}

// ── Generate panel ────────────────────────────────────────
const genTypeEl      = document.getElementById('gen-type');
const rowEmbedEl     = document.getElementById('row-embed-pzn');
const rowPznInputEl  = document.getElementById('row-pzn-input');
const rowInvalidEl   = document.getElementById('row-invalid');
const rowPrefixEl    = document.getElementById('row-ppn-prefix');
const rowEplCompatEl = document.getElementById('row-epl-compat');
const genInvalidCb   = document.getElementById('gen-invalid');

function syncGenOptions() {
  const t = genTypeEl.value;
  rowEmbedEl.classList.toggle('hidden', t !== 'ntin' && t !== 'ppn');
  rowPznInputEl.classList.toggle('hidden', t !== 'ntin' && t !== 'ppn');
  rowPrefixEl.classList.toggle('hidden', t !== 'ppn');
  rowEplCompatEl.classList.toggle('hidden', t !== 'ppn');
  if (t === 'pcid') {
    rowInvalidEl.classList.add('disabled');
    genInvalidCb.checked  = false;
    genInvalidCb.disabled = true;
  } else {
    rowInvalidEl.classList.remove('disabled');
    genInvalidCb.disabled = false;
  }
}

genTypeEl.addEventListener('change', () => {
  syncGenOptions();
  // T064: write back package-identifier on Generate type change
  writeAnchorState();
});
syncGenOptions();

// T065: write back package-identifier on Validate type change
document.getElementById('val-type').addEventListener('change', writeAnchorState);

document.getElementById('btn-generate').addEventListener('click', () => {
  const type        = genTypeEl.value;
  const wantInvalid = !genInvalidCb.disabled && genInvalidCb.checked;
  const embedPzn    = document.getElementById('gen-embed-pzn').checked;
  const includePrefix = document.getElementById('gen-ppn-prefix').checked;
  const eplCompat     = document.getElementById('gen-epl-compat').checked;
  const typeLabel   = type.toUpperCase();
  const embeddedEl  = document.getElementById('gen-embedded');

  embeddedEl.innerHTML = '';

  // Read and validate the optional PZN-to-embed field (NTIN/PPN only)
  let customPzn = null;
  if (type === 'ntin' || type === 'ppn') {
    const customPznRaw = document.getElementById('gen-pzn-input').value.trim();
    if (customPznRaw !== '') {
      if (!validatePzn(customPznRaw)) {
        showResult('gen', false, '\u2014', 'The PZN-to-embed value is not a structurally valid PZN.');
        document.getElementById('gen-copy').dataset.copy = '';
        return;
      }
      customPzn = customPznRaw;
    }
  }

  let value;
  try {
    switch (type) {
      case 'pzn':  value = generatePzn(wantInvalid);            break;
      case 'ntin': value = generateNtin(wantInvalid, embedPzn, customPzn); break;
      case 'gtin': value = generateGtin(wantInvalid);           break;
      case 'ppn':  value = generatePpn(wantInvalid, embedPzn, includePrefix, eplCompat, customPzn);  break;
      case 'pcid': value = generatePcid();                      break;
      default: throw new Error('Unknown type: ' + type);
    }
  } catch (err) {
    showResult('gen', false, '\u2014', 'Error: ' + err.message);
    document.getElementById('gen-copy').dataset.copy = '';
    return;
  }

  const label = wantInvalid
    ? 'Generated invalid ' + typeLabel + ' \u2014 check digit deliberately corrupted'
    : 'Generated valid ' + typeLabel;

  showResult('gen', !wantInvalid, value, label);
  document.getElementById('gen-copy').dataset.copy = value;

  // T056: Show/hide EPL v2.3.x compatibility caveat note
  const caveatEl = document.getElementById('gen-caveat');
  if (type === 'ppn' && eplCompat && !wantInvalid) {
    caveatEl.textContent = 'Note: valid only in EPL v2.3.x compatibility mode (non-standard checksum).';
    caveatEl.classList.remove('hidden');
  } else {
    caveatEl.textContent = '';
    caveatEl.classList.add('hidden');
  }

  if (type === 'ntin') embeddedEl.appendChild(buildEmbeddedPznBlock(extractPznFromNtin(value)));
  else if (type === 'ppn') embeddedEl.appendChild(buildEmbeddedPznBlock(extractPznFromPpn(value)));
});

document.getElementById('gen-copy').addEventListener('click', function () {
  const v = this.dataset.copy || '';
  if (!v || !navigator.clipboard?.writeText) return;

  navigator.clipboard.writeText(v)
    .then(() => {
      this.textContent = 'Copied!';
      setTimeout(() => { this.textContent = 'Copy'; }, 1500);
    })
    .catch(() => {});
});

// ── Validate panel ────────────────────────────────────────
document.getElementById('btn-validate').addEventListener('click', runValidation);
document.getElementById('val-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') runValidation();
});

function runValidation() {
  const type  = document.getElementById('val-type').value;
  const value = document.getElementById('val-input').value.trim();
  const embeddedEl = document.getElementById('val-embedded');
  embeddedEl.innerHTML = '';

  if (!value) {
    showResult('val', false, '\u2014', 'Please enter an identifier value.');
    return;
  }

  let isValid;
  switch (type) {
    case 'pzn':  isValid = validatePzn(value);  break;
    case 'ntin': isValid = validateNtin(value); break;
    case 'gtin': isValid = validateGtin(value); break;
    case 'ppn':  isValid = validatePpn(value);  break;
    case 'pcid': isValid = validatePcid(value); break;
    default:     isValid = false;
  }

  const typeLabel = type.toUpperCase();
  showResult(
    'val', isValid, value,
    isValid
      ? '\u2713 ' + typeLabel + ' is structurally valid'
      : '\u2717 ' + typeLabel + ' is structurally invalid'
  );

  if (type === 'ntin') embeddedEl.appendChild(buildEmbeddedPznBlock(extractPznFromNtin(value)));
  else if (type === 'ppn') embeddedEl.appendChild(buildEmbeddedPznBlock(extractPznFromPpn(value)));
}

function buildEmbeddedPznBlock(pzn) {
  const el = document.createElement('div');
  el.className = 'sub-result';
  if (pzn === null) {
    el.classList.add('warn');
    el.textContent = 'Embedded PZN: could not be extracted';
  } else {
    const ok = validatePzn(pzn);
    el.classList.add(ok ? 'success' : 'error');
    el.innerHTML = 'Embedded PZN: <strong>' + pzn + '</strong> \u2014 ' + (ok ? '\u2713 valid' : '\u2717 invalid');
  }
  return el;
}

// T060: initial anchor-state application — MUST run after all const declarations
// (genTypeEl, syncGenOptions, writeAnchorState) and listener registrations above,
// otherwise the package-identifier branch hits a temporal-dead-zone ReferenceError
// and aborts the entire script block.
applyAnchorState();

function showResult(prefix, success, value, label) {
  const resultEl = document.getElementById(prefix + '-result');
  resultEl.className = 'result show ' + (success ? 'success' : 'error');
  document.getElementById(prefix + '-value').textContent = value;
  document.getElementById(prefix + '-label').textContent = label;
}
</script>
</body>
</html>
